[project]
name = "pybank"
version = "0.1.0"
description = "A terminal-based Python banking system demonstrating clean architecture, object-oriented design, pydantic data validation, SQLite persistence, transaction management, and CLI error handling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types>=0.8.0",
    "colorama>=0.4.6",
    "pydantic[email]>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
